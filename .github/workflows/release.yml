name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack --pack-destination artifacts
      - name: Create package checksum
        working-directory: artifacts
        run: sha256sum contextparcel-0.1.0.tgz > contextparcel-0.1.0.tgz.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/contextparcel-extension-v0.1.0.zip
            artifacts/contextparcel-extension-v0.1.0.zip.sha256
            artifacts/contextparcel-0.1.0.tgz
            artifacts/contextparcel-0.1.0.tgz.sha256
