name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack --pack-destination artifacts
      - name: Create package checksum
        working-directory: artifacts
        shell: bash
        run: |
          package_archive="$(find . -maxdepth 1 -name 'contextparcel-*.tgz' -print -quit)"
          test -n "$package_archive"
          sha256sum "$package_archive" > "$package_archive.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
